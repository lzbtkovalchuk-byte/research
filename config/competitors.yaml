competitors:
  - id: imprint
    name: Imprint
    topics: [vocal, drawing]
    geo: US
    allow_signup: true   # creates a test account with TEST_ACCOUNT_PASSWORD and that run's plus-address
    ads: { page_ids: ["2093351790978732"] }

  - id: breeze
    name: Breeze
    genesis: true
    topics: [vocal, drawing]
    geo: US
    ads: { domains: ["try-breeze.com"] }

  - id: simply-piano
    name: Simply Piano
    topics: [vocal, drawing]
    geo: US
    ads: { page_ids: ["130724596952924"] }
    seeds: ["https://join-piano.hellosimply.com/start/motivationsIntro?exp=selfer&sitelink=rated&utm_source=facebook"]

  - id: memoryos
    name: MemoryOS
    topics: [vocal, drawing]
    geo: US
    ads: { domains: ["memoryos.com"] }
    seeds: ["https://start.memoryos.com/new-h?mos_cfg=seniors_s"]

  - id: chillio
    name: Chillio
    topics: [vocal, drawing]
    geo: US
    ads: { domains: ["get-chillio.app"] }

  - id: learna
    name: Learna
    genesis: true
    topics: [vocal, drawing]
    geo: US
    ads: { page_ids: ["521600091028761", "905964375940334", "894891160380247", "1171046996083903"] }  # Learna runs one page per language
    seeds: ["https://onboarding.ailearna.com/onboarding"]

  - id: copymind
    name: Copymind
    topics: [vocal, drawing]
    geo: GB
    ads: { domains: ["copymind.me"] }
    seeds: ["https://app.copymind.me/welcome-quiz/gender"]

  - id: simply-sing
    name: Simply Sing
    topics: [vocal]
    geo: US
    ads: { page_ids: ["105597079032619"] }
    seeds: ["https://join-sing.hellosimply.com/start"]
    # singyourheartout redirects to the Simply Piano funnel (join-piano), so it is not walked for Simply Sing.
    skip_links: ["welcome.hellosimply.com/singyourheartout"]
    debug: true          # join-sing stalls at "What best describes your voice?": record what the page does (debug.json)
    headed: true         # voice-type test: run in a full browser with the sung-melody mic input

  - id: yousician
    name: Yousician
    topics: [vocal]
    geo: US
    ads: { page_ids: ["245680685625507"] }
    seeds: ["https://yousician.com/?utm_source=facebook"]
    allow_signup: true   # "Let's get started" opens log-in / sign-up: creates a test account like Imprint
    paywall_urls: ["https://account.yousician.com/plans", "https://yousician.com/pricing"]   # behind account creation; opened directly

  - id: smartyme
    name: SmartyMe
    topics: [drawing]
    geo: US
    ads: { page_ids: ["837158766142027"], domains: ["smartymeapp.com"] }
    seeds: ["https://start.smartymeapp.com/quiz"]
    max_minutes: 25      # ~50 screens with long loaders: the default 14 minutes runs out before the paywall

  - id: simply-draw
    name: Simply Draw
    topics: [drawing]
    geo: US
    ads: { page_ids: ["103572289088360"] }
    seeds: ["https://join-draw.hellosimply.com/start?flow=baw"]
