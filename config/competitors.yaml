# Competitor list for the biweekly report.
# geo: GB = UK (Genesis products), US = everything else.
# ads: where to find the app's Meta ads.
#   page_ids  - Meta page ids (exact)
#   domains   - search the Ad Library for this text and keep only ads whose link goes to this domain
# seeds: funnel links to walk even if no ad currently points there.
# max_funnels: how many distinct funnel variants (by link) to walk per run.

settings:
  test_email_env: TEST_EMAIL      # GitHub secret with the email typed into email gates
  test_name: Alex
  max_funnels_per_app: 2
  max_steps: 90

skillsta:
  - id: skillsta-vocal-2
    name: Skillsta · Vocal funnel 2.0
    topic: vocal
    geo: US
    seeds: ["https://www.getskillnow.com/quiz?utm_adname=cf_new_vocal"]
  - id: skillsta-vocal-scanner
    name: Skillsta · Vocal Scanner funnel
    topic: vocal
    geo: US
    seeds: ["https://www.getskillnow.com/quiz/voice_assessment/voice_assessment?utm_adname=CF_voice_assessment"]
  - id: skillsta-drawing
    name: Skillsta · Drawing funnel
    topic: drawing
    geo: US
    seeds: ["https://start.getskillnow.com/quiz?utm_adname=cf_drawing"]

