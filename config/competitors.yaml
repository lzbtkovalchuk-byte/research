# Competitor list for the biweekly report (one merged report for vocal + drawing).
# geo: GB = UK, US = United States. Ads and funnels both use the app's geo.
# ads: where to find the app's Meta ads.
#   page_ids  - Meta page ids (exact)
#   domains   - search the Ad Library for this text and keep only ads whose link goes to this domain
# seeds: funnel links to walk even if no ad currently points there.
# allow_signup: true = may create a test account (password from the TEST_ACCOUNT_PASSWORD secret).
# headed: true = walk in a full (non-headless) browser.
# max_funnels: how many distinct funnel variants (by link) to walk per run.

settings:
  test_email_env: TEST_EMAIL      # GitHub secret with the test Gmail address (also used to read email codes)
  test_email: ''                  # fallback for local runs only
  # Each funnel gets its own plus-address per run (e.g. elza280204+fw261025imprint@gmail.com),
  # so a funnel never rejects the address as "already registered". Mail lands in the same inbox.
  plus_address: true
  test_name: Alex
  max_funnels_per_app: 2
  max_steps: 90
  slack_channel: C09C8NJA1F1      # #skillsta-product-marketing (used if SLACK_CHANNEL_ID isn't set)

# Skillsta's own funnels are not walked for now (their conversion still comes from Amplitude in the analysis step).
# To walk them again, uncomment this block.
skillsta: []
# skillsta:
